name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate configuration files
        run: npm run validate:configs

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      matrix:
        variant: [minimal, dev-env, ai-desktop]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests for ${{ matrix.variant }}
        run: npm run test:integration -- --variant=${{ matrix.variant }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false  # We'll handle large files separately

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Process disk images
        run: |
          echo "Chunking disk images..."
          npm run build:images || echo "No images to process"

      - name: Optimize assets
        run: |
          echo "Optimizing assets..."
          npm run optimize || echo "Optimization skipped"

      - name: Generate variant configurations
        run: npm run build:variants

      - name: Build production bundle
        run: npm run build
        env:
          NODE_ENV: production
          BASE_URL: ${{ steps.pages.outputs.base_path }}

      - name: Generate metadata
        run: npm run generate:metadata

      - name: Validate build size
        run: |
          SIZE=$(du -sb dist | cut -f1)
          SIZE_MB=$(($SIZE / 1024 / 1024))
          MAX_SIZE=$((1024 * 1024 * 1024))  # 1GB
          echo "Build size: ${SIZE_MB}MB"
          if [ $SIZE -gt $MAX_SIZE ]; then
            echo "❌ Build exceeds 1GB GitHub Pages limit: ${SIZE_MB}MB"
            exit 1
          fi
          echo "✅ Build size OK: ${SIZE_MB}MB"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Validate deployment
        run: |
          echo "Deployed to: ${{ steps.deployment.outputs.page_url }}"
          sleep 10
          curl -f ${{ steps.deployment.outputs.page_url }} || exit 1
          echo "✅ Deployment successful!"
